name: Show Opt Results

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

concurrency:
  group: opt-ci-${{ github.event.issue.number }}
  cancel-in-progress: true

permissions:
  issues: write
  contents: write
  pull-requests: write

env:
  WORKSPACE:              ${{ github.workspace }}
  LLVM_SRC_DIR:           ${{ github.workspace }}/repos/llvm-project
  TS_SRC_DIR:             ${{ github.workspace }}/repos/llvm-test-suite
  BUILDS_DIR:             ${{ github.workspace }}/build
  BUILD_LLVM_DIR:         ${{ github.workspace }}/build/build-llvm
  BUILD_TS_DIR:           ${{ github.workspace }}/build/build-test-suite
  RESULTS_DIR:            ${{ github.workspace }}/results


jobs:
  configure:
    if: github.event.sender.type != 'Bot'
    runs-on: [self-hosted, llvm-ci]
    outputs:
      PR_ID:       ${{ steps.extract.outputs.PR_ID }}
      FLAG:        ${{ steps.extract.outputs.FLAG }}
      TESTS:       ${{ steps.extract.outputs.TESTS }}
      COMMIT_HASH: ${{ steps.extract.outputs.COMMIT_HASH }}
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 0

      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.LLVM_LA_BOT_APP_ID }}
          private-key: ${{ secrets.LLVM_LA_BOT_PRIVATE_KEY }}

      - name: Cleanup old builds
        run: |
          if [ -d "${BUILDS_DIR}" ]; then
            rm -rf ${BUILDS_DIR}/*
          else
            mkdir -p ${BUILDS_DIR}
          fi

      - name: Update repos
        run: sh scripts/fetch-upstream.sh

      - name: Parse request
        id: extract
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_ISSUE_BODY: ${{ github.event_name == 'issue_comment' && github.event.comment.body || github.event.issue.body }}
        run: python3 scripts/parse_request.py

  without-pr:
    needs: configure
    runs-on: [self-hosted, llvm-ci]
    outputs:
      BUILD_TIME_BASE: ${{ steps.timing.outputs.duration }}
    steps:
      - name: Checkout PR branch without pull commits
        id: checkout
        run: |
          PR_BRANCH=pr-${{ needs.configure.outputs.PR_ID }}-$(date +%s)
          cd ${LLVM_SRC_DIR}
          git fetch origin pull/${{ needs.configure.outputs.PR_ID }}/head:${PR_BRANCH}
          git checkout ${PR_BRANCH}
          pr_commits=$(git rev-list main.. --count)
          git checkout HEAD~${pr_commits}

      - name: Build LLVM
        id: build
        run: |
          START=$(date +%s)
          sh scripts/build-llvm.sh
          END=$(date +%s)
          echo "duration=$(( END - START ))" >> "$GITHUB_OUTPUT"

      - name: Build test suites
        id: timing
        env:
          FLAG: ${{ needs.configure.outputs.FLAG }}
        run: |
          START=$(date +%s)
          cd ${WORKSPACE}
          BUILD_DIR="${BUILDS_DIR}/base" \
          ASM_DIR="${BUILDS_DIR}" \
          make -f scripts/Makefile \
            SUITES="${{ needs.configure.outputs.TESTS }}" \
            PHASE=base build copy-asm
          END=$(date +%s)
          TOTAL=$(( END - START + ${{ steps.build.outputs.duration }} ))
          MINUTES=$(( TOTAL / 60 ))
          SECONDS=$(( TOTAL % 60 ))
          printf "duration=%dm %ds\n" "$MINUTES" "$SECONDS" >> "$GITHUB_OUTPUT"

  with-pr:
    needs: [without-pr, configure]
    runs-on: [self-hosted, llvm-ci]
    outputs:
      BUILD_TIME_OPT: ${{ steps.timing.outputs.duration }}
    steps:
      - name: Checkout PR branch with pull commits
        run: |
          cd ${LLVM_SRC_DIR}
          git switch -
          git log -1

      - name: Build LLVM
        id: build
        run: |
          START=$(date +%s)
          sh scripts/build-llvm.sh
          END=$(date +%s)
          echo "duration=$(( END - START ))" >> "$GITHUB_OUTPUT"

      - name: Build test suites
        id: timing
        env:
          FLAG: ${{ needs.configure.outputs.FLAG }}
        run: |
          START=$(date +%s)
          cd ${WORKSPACE}
          BUILD_DIR="${BUILDS_DIR}/opt" \
          ASM_DIR="${BUILDS_DIR}" \
          make -f scripts/Makefile \
            SUITES="${{ needs.configure.outputs.TESTS }}" \
            PHASE=opt build copy-asm
          END=$(date +%s)
          TOTAL=$(( END - START + ${{ steps.build.outputs.duration }} ))
          MINUTES=$(( TOTAL / 60 ))
          SECONDS=$(( TOTAL % 60 ))
          printf "duration=%dm %ds\n" "$MINUTES" "$SECONDS" >> "$GITHUB_OUTPUT"

  results:
    needs: [with-pr, without-pr, configure]
    runs-on: [self-hosted, llvm-ci]
    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.LLVM_LA_BOT_APP_ID }}
          private-key: ${{ secrets.LLVM_LA_BOT_PRIVATE_KEY }}

      - name: Diff and create PR
        id: pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          FLAG: ${{ needs.configure.outputs.FLAG }}
          PR_ID: ${{ needs.configure.outputs.PR_ID }}
          TESTS: ${{ needs.configure.outputs.TESTS }}
          COMMIT_HASH: ${{ needs.configure.outputs.COMMIT_HASH }}
          BUILD_TIME: "${{ needs.without-pr.outputs.BUILD_TIME_BASE }} / ${{ needs.with-pr.outputs.BUILD_TIME_OPT }}"
        run: python3 scripts/publish.py

      - name: Comment on issue
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue comment ${{ github.event.issue.number }} --body-file results/issue_comment.md

  on-failure:
    needs: [configure, without-pr, with-pr, results]
    if: always() && (needs.without-pr.result == 'failure' || needs.with-pr.result == 'failure' || needs.results.result == 'failure')
    runs-on: [self-hosted, llvm-ci]
    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.LLVM_LA_BOT_APP_ID }}
          private-key: ${{ secrets.LLVM_LA_BOT_PRIVATE_KEY }}

      - name: Comment failure on issue
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --body "$(cat <<'EOF'
          Hello @${{ github.event.issue.user.login }}

          Build failed for PR #${{ needs.configure.outputs.PR_ID }}. Check the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.
          EOF
          )"