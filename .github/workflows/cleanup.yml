name: Cleanup Stale PRs and Issues

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write
  contents: write

jobs:
  cleanup:
    runs-on: [self-hosted, llvm-ci]
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.LLVM_LA_BOT_APP_ID }}
          private-key: ${{ secrets.LLVM_LA_BOT_PRIVATE_KEY }}

      - name: Close stale PRs (15 days)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh pr list --state open --json updatedAt,number \
            --jq '.[] | select((now - (.updatedAt | fromdateiso8601)) > 1296000) | .number' \
            | while read -r pr; do
                [ -z "$pr" ] && continue
                echo "Closing PR #$pr (idle >15 days)"
                gh pr comment "$pr" --body "Auto-closed: idle for 15 days."
                gh pr close "$pr" --delete-branch
              done

      - name: Close stale issues (30 days)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh issue list --state open --json updatedAt,number \
            --jq '.[] | select((now - (.updatedAt | fromdateiso8601)) > 2592000) | .number' \
            | while read -r issue; do
                [ -z "$issue" ] && continue
                echo "Closing issue #$issue (idle >30 days)"
                gh issue comment "$issue" --body "Auto-closed: idle for 30 days."
                gh issue close "$issue"
              done